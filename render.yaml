services:
  # FastAPI Backend Service
  - type: web
    name: agrigrade-api
    env: python
    region: oregon
    plan: free
    buildCommand: cd backend && pip install --upgrade pip setuptools wheel && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: agrigrade-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: MODEL_PATH
        value: models/best.pt
      - key: CONFIDENCE_THRESHOLD
        value: "0.25"
      - key: ALGORITHM
        value: HS256
      - key: CORS_ORIGINS
        value: "*"

# PostgreSQL Database
databases:
  - name: agrigrade-db
    databaseName: agrigrade
    user: agrigrade_user
    plan: free
